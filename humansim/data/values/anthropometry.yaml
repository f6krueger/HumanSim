group: anthropometry
description: >
  Body size, lengths, breadths and girths. Height and mass are the ICRP 89 reference adult male.
  Every other dimension is defined but has no value yet: it needs a real survey source
  (e.g. ANSUR II or NHANES), not a recalled number.
parameters:
  - {id: height, name: "Height", unit: cm, kind: anchor, values: {male: {adult: 176.0}}, status: referenced, source_ref: pmc8646028, note: "ICRP 89 reference adult male. Read via a secondary paper (PMC8646028), not the original."}
  - {id: body_mass, name: "Body mass", unit: kg, kind: anchor, values: {male: {adult: 73.0}}, status: referenced, source_ref: pmc8646028, note: "ICRP 89 reference adult male. Read via a secondary paper (PMC8646028), not the original."}
