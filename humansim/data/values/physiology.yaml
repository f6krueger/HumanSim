group: physiology
description: >
  Haematological and regulated values that are not in ICRP 89 (the ICRP physiology values are in
  icrp_physiology.yaml). Haematocrit is from a secondary page; haemoglobin ranges are from one hospital
  laboratory; the rest are typical figures not retrieved.
parameters:
  - {id: core_temperature, name: "Resting core temperature", unit: degC, kind: regulated, values: {male: {adult: 37.0}}, status: unsourced, note: "Textbook convention. Measured population means are often a little lower."}
  - {id: hematocrit, name: "Haematocrit", unit: dimensionless, kind: regulated, values: {male: {adult: 0.45}, female: {adult: 0.42}}, status: referenced, source_ref: pmc8646028, ref_range: {male: [0.40, 0.54], female: [0.37, 0.47]}, range_source_ref: glos_haem, note: "Mean quoted in a model-parameter table citing Vander 2001 and Herman 2016. The range is one hospital laboratory's adult male interval."}
  - {id: hemoglobin, name: "Haemoglobin", unit: "g/dL", kind: regulated, values: {male: {adult: 15.0}}, status: unsourced, ref_range: {male: [13.0, 18.0], female: [11.5, 16.5]}, range_source_ref: glos_haem, note: "Mean is a typical clinical figure, not retrieved. The range is one hospital laboratory's adult male interval (130-180 g/L)."}
  - {id: sao2, name: "Arterial oxygen saturation", unit: dimensionless, kind: regulated, values: {male: {adult: 0.98}}, status: unsourced, note: "Typical healthy sea-level value; not retrieved."}
  - {id: pao2, name: "Arterial oxygen partial pressure", unit: mmHg, kind: regulated, values: {male: {adult: 95.0}}, status: unsourced, note: "Typical healthy sea-level range is about 80-100 mmHg; not retrieved."}
  - {id: brain_metabolic_load, name: "Brain metabolic power", unit: W, kind: regulated, values: {male: {adult: 20.0}}, status: unsourced, note: "Commonly quoted figure; not retrieved."}
  - {id: nerve_conduction_velocity, name: "Peak nerve conduction velocity", unit: "m/s", kind: anchor, note: "Define which fibre type (fastest A-alpha) before filling in."}
