[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humansim"
version = "0.1.0"
description = "A reference human model: interconnected anatomical and physiological parameters with provenance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pint>=0.23", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
humansim = "humansim.__main__:main"

[tool.setuptools.packages.find]
include = ["humansim*"]

[tool.setuptools.package-data]
humansim = ["data/**/*.yaml", "data/**/*.csv", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
