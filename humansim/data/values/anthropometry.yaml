group: anthropometry
description: >
  Body size, lengths, breadths and girths for the adult male and female, computed from the public
  ANSUR II files (male n=4082, mean age 30.2; female n=1986, mean age
  28.9). US Army personnel: a military sample, not a general-population reference.
  Both sexes are stored; neither is derived from the other. Parameters without a direct ANSUR II
  measurement have no value. Generated by tools/build_ansur_data.py; edit that script, not this file.
