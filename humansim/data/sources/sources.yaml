# Citation sidecar. The model runs without this file; it feeds reports and integrity checks.
# evidence: A large reference compilation, B established formula or single large study,
#           C secondary compilation or single-site data, D estimate.
# verified_via says how I checked it in this session: retrieved (page read), title_and_equation
# retrieved, or recalled (not retrieved).
sources:
  icrp89:
    citation: "ICRP, 2002. Basic Anatomical and Physiological Data for Use in Radiological Protection: Reference Values. ICRP Publication 89. Annals of the ICRP 32(3-4)."
    url: null
    evidence: A
    verified_via: "read from the PDF supplied by the user (text layer, chapter 2 summary tables 2.8-2.44 and section 7.4). The transcription was checked against the report's own totals: Table 2.8 tissue rows sum to 95.5-96.7% of body mass in every column (the report states 96%), regional blood flows sum to 100% of cardiac output and regional blood contents to 100%, skeletal parts add up to the total skeleton. Not every digit was compared with a page image."
    notes: "Reference man (73 kg, 176 cm) and reference woman (60 kg, 163 cm), Caucasian, mainly European and North American data. Not the same population as ANSUR II, so organ and physiology data (ICRP) and body dimensions (ANSUR II) describe different people. Haematocrit is not in the report."
  ansur2:
    citation: "2012 Anthropometric Survey of U.S. Army Personnel (ANSUR II), public release: ANSUR_II_MALE_Public.csv (n=4082) and ANSUR_II_FEMALE_Public.csv (n=1986). U.S. Army Natick Soldier Research, Development and Engineering Center."
    url: null
    evidence: A
    verified_via: "computed from the attached public CSV files by tools/build_ansur_data.py (survey dates in the file: 4-Oct-10 to 4-Apr-12; mean age 30.2 male, 28.9 female)"
    notes: "US Army personnel (Regular Army, National Guard, Reserve), ages 17-58. A large measured sample, but a military population, so it is leaner, younger and less varied than the general public. Lengths are in mm and weight in tenths of kg in the raw files."
  pmc8646028:
    citation: "Table T2 (fixed model parameters) of PMC8646028, a physiological liver model paper. Article title not recorded. Quotes ICRP 2002, de Simone 1997, Vander 2001 and Herman 2016."
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8646028/table/T2"
    evidence: C
    verified_via: retrieved
    notes: "Secondary compilation, cited here only for haematocrit (male 0.45, female 0.42; quoted from Vander 2001 and Herman 2016, not from ICRP, which gives no haematocrit)."
  glos_haem:
    citation: "Gloucestershire Hospitals NHS Foundation Trust, Haematology reference ranges (adult male: haemoglobin 130-180 g/L, haematocrit 0.40-0.54)."
    url: "https://www.gloshospitals.nhs.uk/our-services/services-we-offer/pathology/haematology/haematology-reference-ranges/"
    evidence: C
    verified_via: retrieved
    notes: "One hospital laboratory; not a population reference standard."
  mifflin1990:
    citation: "Mifflin MD, St Jeor ST, et al. A new predictive equation for resting energy expenditure in healthy individuals. Am J Clin Nutr 1990;51:241-247."
    url: null
    evidence: B
    verified_via: "title and equation retrieved; journal details recalled"
    notes: "Men: 10*weight_kg + 6.25*height_cm - 5*age_years + 5. Used only to seed resting_metabolic_rate."
  dubois1916:
    citation: "Du Bois D, Du Bois EF. A formula to estimate the approximate surface area if height and weight be known. Arch Intern Med 1916;17:863-871."
    url: null
    evidence: B
    verified_via: "recalled, not retrieved"
    notes: "Formula used for body_surface_area. Result for the ICRP reference male is about 1.89 m^2."
  nchs:
    citation: "CDC/NCHS FastStats: Body Measurements. Mean height, weight and waist circumference of US adults aged 20 and over, from the August 2021-August 2023 National Health and Nutrition Examination Survey."
    url: "https://www.cdc.gov/nchs/fastats/body-measurements.htm"
    evidence: B
    verified_via: retrieved
    notes: "General US population (not military), so it differs from ANSUR II in mean mass and age mix. Used only as an independent check on female/male ratios, not as a baseline."
  wang2010:
    citation: "Wang Z, Ying Z, Bosy-Westphal A, et al. Specific metabolic rates of major organs and tissues across adulthood: evaluation by mechanistic model of resting energy expenditure. Am J Clin Nutr 2010;92(6):1369-1377."
    url: null
    evidence: B
    verified_via: "values (liver 200, brain 240, heart 440, kidneys 440, skeletal muscle 13, adipose tissue 4.5 kcal/kg/day; residual 12) read on a secondary page (BioNumbers); original article not read"
    notes: "The residual rate of 12 kcal/kg/day is my reading of the secondary page for 'other tissues' and should be checked against the article."
  cdc2000:
    citation: "Kuczmarski RJ, Ogden CL, Guo SS, et al. 2000 CDC Growth Charts for the United States: methods and development. Vital Health Stat 11(246), 2002. LMS parameter tables for stature/length, weight, head circumference and BMI for age, birth to 20 years."
    url: "https://www.cdc.gov/growthcharts/cdc-data-files.htm"
    evidence: A
    verified_via: "CDC and WHO sites were not reachable from the workspace. The tables were taken from the MIT-licensed PyPI package growthcharts 0.2.1 (a third-party copy of the CDC data) and spot-checked: male birth length 49.99 cm and weight 3.53 kg, female age-20 median stature 163.34 cm and weight 58.2 kg match the published CDC values I know. Not compared row by row with the CDC files."
    notes: "US children measured mainly 1963-1994, so not a current or non-US reference. CDC itself recommends the WHO standards below age 2; the CDC infant tables are used here because WHO tables were not retrievable. Data are a US government work. Medians are used as 'the average child'."
