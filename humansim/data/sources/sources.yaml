# Citation sidecar. The model runs without this file; it feeds reports and integrity checks.
# evidence: A large reference compilation, B established formula or single large study,
#           C secondary compilation or single-site data, D estimate.
# verified_via says how I checked it in this session: retrieved (page read), title_and_equation
# retrieved, or recalled (not retrieved).
sources:
  icrp89:
    citation: "ICRP, 2002. Basic Anatomical and Physiological Data for Use in Radiological Protection: Reference Values. ICRP Publication 89. Annals of the ICRP 32(3-4)."
    url: null
    evidence: A
    verified_via: "read from the PDF supplied by the user (text layer, chapter 2 summary tables 2.8-2.44 and section 7.4). The transcription was checked against the report's own totals: Table 2.8 tissue rows sum to 95.5-96.7% of body mass in every column (the report states 96%), regional blood flows sum to 100% of cardiac output and regional blood contents to 100%, skeletal parts add up to the total skeleton. Not every digit was compared with a page image."
    notes: "Reference man (73 kg, 176 cm) and reference woman (60 kg, 163 cm), Caucasian, mainly European and North American data. Not the same population as ANSUR II, so organ and physiology data (ICRP) and body dimensions (ANSUR II) describe different people. Haematocrit is not in the report."
  ansur2:
    citation: "2012 Anthropometric Survey of U.S. Army Personnel (ANSUR II), public release: ANSUR_II_MALE_Public.csv (n=4082) and ANSUR_II_FEMALE_Public.csv (n=1986). U.S. Army Natick Soldier Research, Development and Engineering Center."
    url: null
    evidence: A
    verified_via: "computed from the attached public CSV files by tools/build_ansur_data.py (survey dates in the file: 4-Oct-10 to 4-Apr-12; mean age 30.2 male, 28.9 female)"
    notes: "US Army personnel (Regular Army, National Guard, Reserve), ages 17-58. A large measured sample, but a military population, so it is leaner, younger and less varied than the general public. Lengths are in mm and weight in tenths of kg in the raw files."
  pmc8646028:
    citation: "Table T2 (fixed model parameters) of PMC8646028, a physiological liver model paper. Article title not recorded. Quotes ICRP 2002, de Simone 1997, Vander 2001 and Herman 2016."
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8646028/table/T2"
    evidence: C
    verified_via: retrieved
    notes: "Secondary compilation, cited here only for haematocrit (male 0.45, female 0.42; quoted from Vander 2001 and Herman 2016, not from ICRP, which gives no haematocrit)."
  glos_haem:
    citation: "Gloucestershire Hospitals NHS Foundation Trust, Haematology reference ranges (adult male: haemoglobin 130-180 g/L, haematocrit 0.40-0.54)."
    url: "https://www.gloshospitals.nhs.uk/our-services/services-we-offer/pathology/haematology/haematology-reference-ranges/"
    evidence: C
    verified_via: retrieved
    notes: "One hospital laboratory; not a population reference standard."
  mifflin1990:
    citation: "Mifflin MD, St Jeor ST, et al. A new predictive equation for resting energy expenditure in healthy individuals. Am J Clin Nutr 1990;51:241-247."
    url: null
    evidence: B
    verified_via: "title and equation retrieved; journal details recalled"
    notes: "Men: 10*weight_kg + 6.25*height_cm - 5*age_years + 5. Used only to seed resting_metabolic_rate."
  dubois1916:
    citation: "Du Bois D, Du Bois EF. A formula to estimate the approximate surface area if height and weight be known. Arch Intern Med 1916;17:863-871."
    url: null
    evidence: B
    verified_via: "recalled, not retrieved"
    notes: "Formula used for body_surface_area. Result for the ICRP reference male is about 1.89 m^2."
  nchs:
    citation: "CDC/NCHS FastStats: Body Measurements. Mean height, weight and waist circumference of US adults aged 20 and over, from the August 2021-August 2023 National Health and Nutrition Examination Survey."
    url: "https://www.cdc.gov/nchs/fastats/body-measurements.htm"
    evidence: B
    verified_via: retrieved
    notes: "General US population (not military), so it differs from ANSUR II in mean mass and age mix. Used only as an independent check on female/male ratios, not as a baseline."
  wang2010:
    citation: "Wang Z, Ying Z, Bosy-Westphal A, et al. Specific metabolic rates of major organs and tissues across adulthood: evaluation by mechanistic model of resting energy expenditure. Am J Clin Nutr 2010;92(6):1369-1377."
    url: null
    evidence: B
    verified_via: "values (liver 200, brain 240, heart 440, kidneys 440, skeletal muscle 13, adipose tissue 4.5 kcal/kg/day; residual 12) read on a secondary page (BioNumbers); original article not read"
    notes: "The residual rate of 12 kcal/kg/day is my reading of the secondary page for 'other tissues' and should be checked against the article."
  cdc2000:
    citation: "Kuczmarski RJ, Ogden CL, Guo SS, et al. 2000 CDC Growth Charts for the United States: methods and development. Vital Health Stat 11(246), 2002. LMS parameter tables for stature/length, weight, head circumference and BMI for age, birth to 20 years."
    url: "https://www.cdc.gov/growthcharts/cdc-data-files.htm"
    evidence: A
    verified_via: "CDC and WHO sites were not reachable from the workspace. The tables were taken from the MIT-licensed PyPI package growthcharts 0.2.1 (a third-party copy of the CDC data) and spot-checked: male birth length 49.99 cm and weight 3.53 kg, female age-20 median stature 163.34 cm and weight 58.2 kg match the published CDC values I know. Not compared row by row with the CDC files."
    notes: "US children measured mainly 1963-1994, so not a current or non-US reference. CDC itself recommends the WHO standards below age 2; the CDC infant tables are used here because WHO tables were not retrievable. Data are a US government work. Medians are used as 'the average child'."
  mayo_ridgeview:
    citation: "Mayo Clinic Laboratories, Testosterone, Total, Bioavailable, and Free, Serum (test LABTSTBF), reference values by sex and age and Tanner stage, as published on the Ridgeview Medical Center test catalog (ridgeviewmedical.testcatalog.org/show/LABTSTBF). Portions (c) 2026 Mayo Foundation for Medical Education and Research."
    url: "https://ridgeviewmedical.testcatalog.org/show/LABTSTBF"
    evidence: C
    verified_via: "page retrieved; reference-value tables read"
    notes: "A single reference laboratory's intervals, mirrored on a hospital catalog page. The page does not state how the interval is defined; the central 95% convention is assumed. Total testosterone, bioavailable and free testosterone by age are given; only adult total testosterone is used so far."
  mainegeneral:
    citation: "Maine General Medical Center laboratory test catalog: Luteinizing Hormone (LH), Follicle-Stimulating Hormone (FSH) and Sex Hormone-Binding Globulin (SHBG1) serum reference values (mainegeneral.testcatalog.org)."
    url: "https://mainegeneral.testcatalog.org/show/LH"
    evidence: C
    verified_via: "pages retrieved; reference-value sections read"
    notes: "Single-laboratory reference intervals. Interval definition not stated (central 95% assumed). The LH, FSH and SHBG pages come from the same catalog."
  christianacare:
    citation: "ChristianaCare laboratory test catalog: Estradiol, Serum (test E2) reference ranges (christianacare.testcatalog.org/show/E2)."
    url: "https://christianacare.testcatalog.org/show/E2"
    evidence: C
    verified_via: "page retrieved; reference-value section read"
    notes: "Single-laboratory reference intervals; no pediatric interval was listed."
  crouse_atellica:
    citation: "Laboratory Alliance of Central New York, Atellica Hormone Reference Ranges, effective 15 February 2022 (providerportal.crouse.org). Progesterone, cortisol and prolactin intervals."
    url: "https://providerportal.crouse.org/wp-content/uploads/2022/02/Hormone-Reference-Range-2-15-22.pdf"
    evidence: C
    verified_via: "PDF retrieved; ranges read"
    notes: "Single-laboratory intervals. Cortisol is given without a sex qualifier."
  bhasin2001:
    citation: "Bhasin S, Woodhouse L, Casaburi R, et al. Testosterone dose-response relationships in healthy young men. Am J Physiol Endocrinol Metab 2001;281(6):E1172-E1181."
    url: "https://pubmed.ncbi.nlm.nih.gov/11701431/"
    evidence: B
    verified_via: "abstract retrieved via PubMed: 61 men aged 18-35, GnRH agonist suppression, weekly testosterone enanthate 25, 50, 125, 300 or 600 mg for 20 weeks; nadir serum testosterone 253, 306, 542, 1345, 2370 ng/dL; fat-free mass +3.4, +5.2, +7.9 kg at 125, 300, 600 mg. The full paper was not read."
    notes: "Men with their own testosterone suppressed, after 20 weeks, so a sustained-level effect. Effects on haemoglobin and fat mass are reported only as correlations in the abstract, with no numbers."
  fda_apap_iv_2021:
    citation: "Acetaminophen for injection (1,000 mg/100 mL vial), prescribing information, Mylan Institutional, revised 1/2021 (FDA NDA 204957/206610 label), section 12.3 Pharmacokinetics, Table 5."
    url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2021/206610s000lbl.pdf"
    evidence: B
    verified_via: "label text retrieved via WebFetch: single 1,000 mg IV dose in adults, CL 0.27 L/h/kg (SD 0.08), Vss 0.8 L/kg (SD 0.2), half-life 2.4 h (SD 0.6), Cmax 28 mcg/mL, AUC0-6h 43 mcg*h/mL; <5% unchanged in urine; protein binding 10-25%."
    notes: "Label values from healthy adult volunteers; the label does not state their body mass or sex, so per-kg values are applied to both sexes. Oral bioavailability is not stated, so no oral route is modelled."
  pfizer_midazolam_label:
    citation: "Midazolam injection, prescribing information, Clinical Pharmacology (Pharmacokinetics, Distribution, Metabolism, Excretion), Pfizer Medical Information."
    url: "https://www.pfizermedical.com/midazolam/clinical-pharmacology"
    evidence: B
    verified_via: "page text retrieved via WebFetch: clearance 0.25-0.54 L/h/kg and volume of distribution 1.0-3.1 L/kg from six single-dose studies in healthy adults; half-life 1.8-6.4 h (mean about 3 h); CYP3A4 in liver and gut wall; <0.5% unchanged in urine."
    notes: "The label gives ranges across studies, not a mean; the model uses range midpoints, which are not means. No oral bioavailability or extraction ratio is stated, so only intravenous dosing is modelled."
  cpic_nsaid_2020:
    citation: "CPIC guideline for CYP2C9 and nonsteroidal anti-inflammatory drugs (Clinical Pharmacogenetics Implementation Consortium, 2020), Table 1 (allele function, activity scores, phenotypes) and the meta-analysis of drug exposure by diplotype."
    url: "https://files.cpicpgx.org/data/guideline/publication/NSAID/2020/32189324.pdf"
    evidence: A
    verified_via: "guideline PDF retrieved via WebFetch (summarised by the fetch tool, not read page by page): *1 activity 1.0; *2 0.5; *3 0 (moved to no function in this guideline); AS 2 NM, 1.5 and 1 IM, 0.5 and 0 PM; mean AUC ratios versus *1/*1: celecoxib 1.62 (*1/*3) and 4.17 (*3/*3), ibuprofen 1.43 (*1/*3), meloxicam 1.82 (*1/*3)."
    notes: "Exposure ratios come from oral studies, so they are ratios of oral AUC (apparent clearance), and applying them to intravenous dosing assumes bioavailability does not change with genotype. The guideline gives no allele frequencies in the text I could read."
  warfarin_label_cyp2c9:
    citation: "Warfarin sodium tablets, prescribing information, sections 12.3 and 12.5 (CYP2C9 pharmacogenomics), as reproduced on medlibrary.org."
    url: "https://medlibrary.org/lib/rx/meds/warfarin-sodium/page/6/"
    evidence: B
    verified_via: "page text retrieved via WebFetch: 'The frequencies of these alleles in Caucasians are approximately 11% and 7% for CYP2C9*2 and CYP2C9*3, respectively.'"
    notes: "Gives allele frequencies for people of European ancestry only. No other ancestry group is available, so population-average genotype frequencies exist only for that group."
  fda_ibuprofen_iv_2021:
    citation: "Caldolor (ibuprofen) injection, prescribing information, Cumberland Pharmaceuticals (FDA label 022348s018, 2021), section 12.3 Table 4."
    url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2021/022348s018lbl.pdf"
    evidence: B
    verified_via: "label retrieved via WebFetch: 800 mg over 60 min in 12 adults, AUC 192.8 mcg*h/mL, KEL 0.29 1/h, T1/2 2.44 h; >99% protein bound. The label gives no adult clearance or volume of distribution; the model derives clearance = dose / AUC and volume = clearance / KEL."
    notes: "Derived, not quoted: clearance 4.15 L/h and volume 14.3 L assume the reported AUC is AUC to infinity. Volunteer body mass is not given; the values are applied to the 73 kg / 60 kg reference person as a per-kg figure (4.15/73), which is an assumption. Binding is saturable, so values at 400 mg differ (3.7 L/h)."
