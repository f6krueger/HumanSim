# Phase 3 couplings. Read humansim/couplings.py for what kind, role, deadband and validity mean.
# Order matters only for how fast the solver converges; the result does not depend on it.
couplings:
  # --- body size ---------------------------------------------------------------------------
  - id: mass_from_height_and_edited_tissues
    target: body_mass
    fn: body_mass_balance
    args: {height_exponent: 2.0, tissues: [skeletal_muscle_mass, skeleton_mass, adipose_tissue_mass, skin_mass, liver_mass, brain_mass, heart_mass, kidneys_mass, lungs_mass, spleen_mass, pancreas_mass, thyroid_mass]}
    kind: assumed
    role: accounting
    validity: [0.8, 1.3]
    note: "Mass follows height with exponent 2 (adult BMI roughly independent of height; assumed, not fitted), plus the change in any tissue the user edited. Exponent 3 (geometric similarity) would give a far heavier tall body."

  - id: linear_dimensions_follow_height
    select: {group: anthropometry, unit: cm, exclude: [height, head_circumference, head_length, head_breadth]}
    fn: power_ratio
    args: {inputs: {height: 1.0}}
    kind: assumed
    role: accounting
    validity: [0.8, 1.3]
    note: "Isometric scaling: every linear dimension keeps its proportion to stature. A body-shape simplification; real tall people differ in proportions."

  - id: head_dimensions_follow_height
    targets: [head_circumference, head_length, head_breadth]
    fn: power_ratio
    args: {inputs: {height: 0.5}}
    kind: assumed
    role: accounting
    validity: [0.8, 1.3]
    note: "Head size scales with stature to the power 0.5, so a taller body has a larger but proportionally smaller head. The exponent is an assumption; the ANSUR II female/male head ratio (0.977 against 0.927 for stature) points the same way but mixes size with sex."

  # --- tissue and organ masses respond to body mass, but only outside normal variation ------
  - id: tissue_follows_body_mass
    targets: [skeletal_muscle_mass, skeleton_mass, adipose_tissue_mass, skin_mass]
    fn: power_ratio
    args: {inputs: {body_mass: 1.0}}
    kind: assumed
    role: compensation
    deadband: ref_range
    validity: [0.6, 1.6]
    note: "Assumed proportional to body mass once body mass leaves its reference range. Which tissue really takes up an excess (fat or muscle) depends on the cause."

  - id: organ_follows_body_mass
    targets: [liver_mass, kidneys_mass, lungs_mass, spleen_mass, pancreas_mass, thyroid_mass]
    fn: power_ratio
    args: {inputs: {body_mass: 0.75}}
    kind: assumed
    role: compensation
    deadband: ref_range
    validity: [0.6, 1.6]
    note: "Organ mass scales with body mass to the power 0.75 once body mass leaves its reference range. A crude allometric stand-in applied within humans; unsourced. Brain mass is held constant."

  # --- metabolism and circulation --------------------------------------------------------
  - id: rmr_is_sum_of_tissue_rates
    target: resting_metabolic_rate
    fn: rmr_organ_sum
    args:
      total: body_mass
      residual_rate: 12.0
      rates: {liver_mass: 200.0, brain_mass: 240.0, heart_mass: 440.0, kidneys_mass: 440.0, skeletal_muscle_mass: 13.0, adipose_tissue_mass: 4.5}
    kind: mechanistic
    role: accounting
    validity: [0.5, 2.0]
    status: referenced
    source_ref: wang2010
    note: "Resting energy expenditure is the sum of tissue mass times its specific rate (kcal/kg/day). Everything not listed (bone, skin, gut, other organs) is the residual mass at 12 kcal/kg/day. Only the ratio to the reference sum is used, so the stored Mifflin-St Jeor value stays the baseline."

  - id: cardiac_output_follows_oxygen_demand
    target: cardiac_output
    fn: fick_cardiac_output
    args: {demand: resting_metabolic_rate}
    kind: mechanistic
    role: compensation
    deadband: 0.10
    validity: [0.5, 2.5]
    status: unsourced
    note: "Fick principle: cardiac output = O2 consumption / arterial-venous O2 difference, with the difference held constant. The Fick relation is a law; the constant extraction and the 10% deadband are assumptions."

  - id: heart_mass_follows_cardiac_output
    target: heart_mass
    fn: power_ratio
    args: {inputs: {cardiac_output: 1.0}}
    kind: assumed
    role: compensation
    deadband: 0.10
    validity: [0.5, 2.0]
    note: "Heart tissue mass proportional to the output it must deliver (assumed). Creates a feedback loop with the metabolic rate; the solver iterates it to a fixed point."

  - id: hepatic_flow_follows_liver_oxygen_use
    target: hepatic_flow_fraction
    fn: metabolic_share
    args:
      organ: liver_mass
      total: body_mass
      residual_rate: 12.0
      rates: {liver_mass: 200.0, brain_mass: 240.0, heart_mass: 440.0, kidneys_mass: 440.0, skeletal_muscle_mass: 13.0, adipose_tissue_mass: 4.5}
    kind: assumed
    role: compensation
    deadband: 0.10
    validity: [0.5, 2.0]
    note: "The liver's share of cardiac output follows its share of resting oxygen use (constant extraction, assumed)."

  - id: blood_volume_follows_body_mass
    target: blood_volume
    fn: power_ratio
    args: {inputs: {body_mass: 1.0}}
    kind: empirical
    role: compensation
    deadband: ref_range
    validity: [0.6, 1.6]
    note: "Blood volume proportional to body mass once mass leaves its reference range (roughly 65 to 73 mL/kg in the ICRP reference adults). Proportionality is a simplification."
