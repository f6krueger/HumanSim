group: physiology
description: >
  Cardiovascular, haematological and metabolic values. Cardiac output, blood volume, haematocrit
  and the hepatic flow fraction were read from secondary pages quoting ICRP 89 and standard
  physiology texts. Haematocrit and haemoglobin ranges come from one hospital laboratory.
parameters:
  - {id: core_temperature, name: "Resting core temperature", unit: degC, kind: regulated, values: {male: {adult: 37.0}}, status: unsourced, note: "Textbook convention. Measured population means are often a little lower."}
  - {id: resting_metabolic_rate, name: "Resting metabolic rate", unit: "kcal/day", kind: regulated, values: {male: {adult: 1685.0}}, status: unsourced, source_ref: mifflin1990, note: "Computed with Mifflin-St Jeor (10*73 + 6.25*176 - 5*30 + 5) for the reference male at an ASSUMED age of 30. ICRP 89 is not the source of this number. See source mifflin1990."}
  - {id: water_requirement, name: "Water requirement", unit: "L/day", kind: regulated}
  - {id: blood_volume, name: "Total blood volume", unit: L, kind: regulated, values: {male: {adult: 5.3}}, status: referenced, source_ref: pmc6343858, note: "ICRP 89 section 7.4, 5300 cm^3 for the reference male, read via PMC6343858."}
  - {id: hematocrit, name: "Haematocrit", unit: dimensionless, kind: regulated, values: {male: {adult: 0.45}}, status: referenced, source_ref: pmc8646028, ref_range: {male: [0.40, 0.54]}, range_source_ref: glos_haem, note: "Mean quoted in a model-parameter table citing Vander 2001 and Herman 2016. The range is one hospital laboratory's adult male interval."}
  - {id: hemoglobin, name: "Haemoglobin", unit: "g/dL", kind: regulated, values: {male: {adult: 15.0}}, status: unsourced, ref_range: {male: [13.0, 18.0]}, range_source_ref: glos_haem, note: "Mean is a typical clinical figure, not retrieved. The range is one hospital laboratory's adult male interval (130-180 g/L)."}
  - {id: sao2, name: "Arterial oxygen saturation", unit: dimensionless, kind: regulated, values: {male: {adult: 0.98}}, status: unsourced, note: "Typical healthy sea-level value; not retrieved."}
  - {id: pao2, name: "Arterial oxygen partial pressure", unit: mmHg, kind: regulated, values: {male: {adult: 95.0}}, status: unsourced, note: "Typical healthy sea-level range is about 80-100 mmHg; not retrieved."}
  - {id: cardiac_output, name: "Cardiac output (resting)", unit: "L/min", kind: regulated, values: {male: {adult: 6.5}}, status: referenced, source_ref: pmc8646028, note: "ICRP 89 reference male, 6.5 L/min, read via PMC8646028."}
  - {id: hepatic_flow_fraction, name: "Hepatic blood flow, fraction of cardiac output", unit: dimensionless, kind: regulated, values: {male: {adult: 0.255}}, status: referenced, source_ref: pmc8646028, note: "Quoted as 0.255 (ICRP 2002) in PMC8646028, where it is labelled hepatic vein; treated here as total hepatic flow."}
  - {id: brain_metabolic_load, name: "Brain metabolic power", unit: W, kind: regulated, values: {male: {adult: 20.0}}, status: unsourced, note: "Commonly quoted figure; not retrieved."}
  - {id: nerve_conduction_velocity, name: "Peak nerve conduction velocity", unit: "m/s", kind: anchor, note: "Define which fibre type (fastest A-alpha) before filling in."}
